name: README Change Validator

on:
  pull_request:
    paths:
      - 'README.md'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/*.yml'

permissions:
  contents: read

jobs:
  check-readme-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test generator and provider classifications
        run: python -m unittest discover -s tests
      - name: Verify README is generated from committed sources
        run: python src/pull_available_models.py --check
