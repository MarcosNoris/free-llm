name: Update README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate generator
        run: python -m unittest discover -s tests
      - name: Refresh public catalog and generate README
        run: python -u src/pull_available_models.py --refresh-models
      - name: Verify generated README
        run: python src/pull_available_models.py --check
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Update README with latest free model catalog"
          body: "Refreshes public OpenRouter model metadata. Provider offers and their manual review dates are unchanged."
          branch: update-readme
          base: main
          commit-message: "Refresh public free model catalog"
          add-paths: |
            README.md
            src/openrouter_models.json
